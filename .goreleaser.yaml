# GoReleaser configuration — builds release binaries and publishes
# them to GitHub Releases when a tag is pushed (see .github/workflows/release.yml).
# Docs: https://goreleaser.com

version: 2

project_name: justrouting-mcp

builds:
  - id: justrouting-mcp
    main: ./cmd/justrouting-mcp
    binary: justrouting-mcp
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - "-s -w -X github.com/justrouting/mcp/internal/server.version={{ .Version }}"

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Versionless asset names so install.sh can use the stable
    # /releases/latest/download/<asset> URL. A specific version can be
    # pinned via /releases/download/vX.Y.Z/<asset>.
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

dockers:
  - image_templates:
      - "ghcr.io/justrouting/justrouting-mcp:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/justrouting/mcp"
  - image_templates:
      - "ghcr.io/justrouting/justrouting-mcp:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/justrouting/mcp"

docker_manifests:
  - name_template: ghcr.io/justrouting/justrouting-mcp:{{ .Version }}
    image_templates:
      - ghcr.io/justrouting/justrouting-mcp:{{ .Version }}-amd64
      - ghcr.io/justrouting/justrouting-mcp:{{ .Version }}-arm64
  - name_template: ghcr.io/justrouting/justrouting-mcp:latest
    image_templates:
      - ghcr.io/justrouting/justrouting-mcp:{{ .Version }}-amd64
      - ghcr.io/justrouting/justrouting-mcp:{{ .Version }}-arm64

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch
